[project]
name = "live-music-agent"
version = "0.1.0"
description = "Live music gig recommendation agent using LangGraph with Spotify/YouTube integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=1.0.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.28.0",
    "pyyaml>=6.0",
    # NEW: Music platform integrations
    "spotipy>=2.23.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-api-python-client>=2.108.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
]